<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Hive</title>
<script src="https://cdn.jsdelivr.net/npm/@hiveio/dhive@1.2.8/dist/dhive.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#101010; --mut:#8a8a8e; --line:#dcdcdf; --soft:#f3f3f5; --like:#e0245e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101010; --fg:#f3f5f7; --mut:#777; --line:#2e2e30; --soft:#1c1c1e; --like:#ff4d79; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
  header b { font-size:17px; } header button { background:none; border:0; color:var(--mut); font:inherit; }
  main { max-width:620px; margin:0 auto; padding-bottom:90px; }
  .w { display:flex; gap:10px; padding:12px 16px 4px; border-bottom:1px solid var(--line); }
  .w.sub { border:0; padding:8px 0 0; }
  .av { display:flex; flex-direction:column; align-items:center; flex:none; }
  .av img { width:38px; height:38px; border-radius:50%; background:var(--soft); object-fit:cover; }
  .av i { flex:1; width:2px; background:var(--line); margin:6px 0 2px; border-radius:2px; }
  .c { flex:1; min-width:0; padding-bottom:8px; }
  .meta { display:flex; gap:8px; align-items:baseline; } .meta b { font-weight:600; } .meta span { color:var(--mut); font-size:13px; }
  .body { overflow-wrap:anywhere; margin:2px 0 6px; } .body p { margin:0 0 6px; } .body img { max-width:100%; border-radius:10px; display:block; margin:6px 0; }
  .act { display:flex; gap:18px; } .act button { background:none; border:0; color:var(--mut); font:inherit; padding:4px 0; display:flex; gap:5px; align-items:center; }
  .act svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; } .act .on { color:var(--like); } .act .on svg { fill:var(--like); }
  .thread { border-top:1px solid var(--line); margin-top:6px; padding-top:4px; }
  .rbox { display:flex; gap:8px; margin:8px 0; } .rbox input { flex:1; }
  input, textarea, select { font:inherit; color:var(--fg); background:var(--soft); border:0; border-radius:10px; padding:10px 12px; width:100%; }
  button.p { background:var(--fg); color:var(--bg); border:0; border-radius:20px; padding:9px 18px; font:inherit; font-weight:600; }
  button:disabled { opacity:.5; }
  #fab { position:fixed; right:18px; bottom:20px; width:54px; height:54px; border-radius:50%; border:0; background:var(--fg); color:var(--bg); font-size:30px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:10; }
  .sheet.open { display:flex; }
  .sheet > div { overscroll-behavior:contain; max-height:92vh; overflow:auto; background:var(--bg); width:100%; max-width:620px; margin:0 auto; border-radius:18px 18px 0 0; padding:16px; }
  .sheet textarea { min-height:140px; resize:none; margin:10px 0; }
  .sheet .top { display:flex; justify-content:space-between; align-items:center; }
  .sheet .top button:first-child { background:none; border:0; color:var(--mut); font:inherit; }
  .rbox .ph { background:var(--soft); color:var(--fg); border:0; border-radius:20px; padding:8px 12px; font:inherit; }
  .tools { display:flex; align-items:center; gap:12px; }
  .tools button { background:var(--soft); color:var(--fg); border:0; border-radius:20px; padding:8px 14px; font:inherit; }
  #up { color:var(--mut); font-size:13px; }
  details { margin-top:12px; } summary { color:var(--mut); }
  .orow { display:flex; gap:8px; margin:8px 0; } .orow input { flex:1; } .orow button, #addben { background:var(--soft); color:var(--fg); border:0; border-radius:20px; padding:8px 14px; font:inherit; }
  select { margin:6px 0; } .ben { display:flex; gap:8px; margin:6px 0; } .ben .bp { max-width:80px; } .ben button { background:none; border:0; color:var(--mut); font-size:20px; }
  #bell { position:relative; padding:0; } #badge { position:absolute; top:-5px; right:-8px; background:var(--like); color:#fff; border-radius:10px; font-size:11px; line-height:16px; padding:0 5px; }
  .nt { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); } .nt.go { cursor:pointer; } .nt .av img { width:34px; height:34px; }
  .bk { background:none; border:0; color:var(--mut); font:inherit; padding:4px 0 8px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:2px 0 10px; } .bar i { display:block; height:100%; background:var(--fg); border-radius:3px; }
  .kpi { display:flex; flex-wrap:wrap; gap:8px; } .kpi div { flex:1 1 90px; background:var(--soft); border-radius:10px; padding:8px 10px; font-size:13px; color:var(--mut); } .kpi b { display:block; font-size:20px; color:var(--fg); }
  .sh { font-weight:600; margin:16px 0 6px; } .sm { color:var(--mut); font-size:13px; } .top5 { padding:8px 0; border-bottom:1px solid var(--line); } .top5 a { color:inherit; text-decoration:none; }
  .chips { display:flex; gap:8px; margin:12px 0; } .chips button { flex:1; background:var(--soft); color:var(--fg); border:0; border-radius:20px; padding:8px; font:inherit; }
  #vr { width:100%; padding:0; background:transparent; accent-color:var(--like); }
  header { flex-wrap:wrap; }
  #sect { display:flex; gap:6px; width:100%; margin-top:10px; } #sect button { flex:1; background:none; border:0; border-bottom:2px solid transparent; color:var(--mut); font:inherit; font-weight:600; padding:6px; border-radius:0; } #sect button.on { color:var(--fg); border-color:var(--fg); }
  #tabs { display:flex; gap:8px; width:100%; overflow-x:auto; margin-top:10px; }
  #tabs button { flex:none; background:var(--soft); color:var(--fg); border:0; border-radius:18px; padding:6px 14px; font:inherit; }
  #tabs button.on { background:var(--fg); color:var(--bg); }
  #csel { width:100%; margin-top:8px; }
  #qchips { display:flex; gap:6px; width:100%; overflow-x:auto; margin-top:8px; } #qchips[hidden] { display:none; }
  #qchips button { flex:none; background:var(--soft); color:var(--fg); border:0; border-radius:16px; padding:4px 12px; font:inherit; font-size:13px; }
  .tg { color:#3b82f6; cursor:pointer; }
  #lb { position:fixed; inset:0; background:#000; z-index:30; display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; } #lb[hidden] { display:none; }
  #lbi { max-width:100%; max-height:100%; transform-origin:center; user-select:none; -webkit-user-drag:none; will-change:transform; }
  #lbx { position:absolute; top:12px; right:14px; width:40px; height:40px; border:0; border-radius:50%; background:rgba(255,255,255,.18); color:#fff; font-size:26px; line-height:1; }
  #lbc { position:absolute; bottom:18px; color:#fff; font-size:13px; }
  .body img { cursor:zoom-in; }
  .meta b, .av img { cursor:pointer; }
  .prof { display:flex; gap:12px; align-items:center; margin-bottom:10px; } .pimg { width:56px; height:56px; border-radius:50%; background:var(--soft); object-fit:cover; flex:none; } .pabout { margin:2px 0; }
  .act .bm { margin-left:auto; } .act .bm.on { color:var(--fg); } .act .bm.on svg { fill:currentColor; }
  #msg { padding:10px 16px; color:var(--mut); font-size:13px; } .err { color:var(--like); }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const client = new dhive.Client(['https://api.hive.blog','https://api.deathwing.me','https://anyx.io']);
const HOSTS = ['hive.flow','ecency.waves'];
let me = '', key = null, container = null;
try { me = localStorage.getItem('ht_u') || ''; const k = localStorage.getItem('ht_k'); if (k) key = dhive.PrivateKey.fromString(k); } catch (e) {}
const refreshAcc = () => $('#acc').textContent = me ? '@' + me : 'Увійти';
refreshAcc();

const msg = (t, err) => { $('#msg').textContent = t; $('#msg').className = err ? 'err' : ''; };
const ago = s => { const d = (Date.now() - new Date(s + 'Z')) / 1000;
  return d < 60 ? 'щойно' : d < 3600 ? Math.floor(d/60) + ' хв' : d < 86400 ? Math.floor(d/3600) + ' год' : Math.floor(d/86400) + ' д'; };
const md = t => DOMPurify.sanitize(marked.parse(t, { breaks: true }));
const ICON_H = '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const ICON_B = '<svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>';
const ICON_C = '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>';

function card(p, line) {
  const liked = (p.active_votes || []).some(v => v.voter === me);
  const el = document.createElement('div');
  el.className = 'w' + (line ? '' : ' sub');
  el.innerHTML = `<div class="av"><img loading="lazy" src="https://images.hive.blog/u/${p.author}/avatar/small" alt=""><i></i></div>
    <div class="c"><div class="meta"><b>${p.author}</b><span>${ago(p.created)}</span></div>
    <div class="body">${md(p.body)}</div>
    <div class="act"><button class="lk ${liked ? 'on' : ''}">${ICON_H}<span>${p.net_votes ?? (p.active_votes || []).length}</span></button>
    <button class="rp">${ICON_C}<span>${p.children}</span></button><button class="bm ${isBm(p) ? 'on' : ''}" aria-label="Закладка">${ICON_B}</button></div><div class="slot"></div></div>`;
  if (!line) el.querySelector('.av i').remove();
  el.querySelector('.lk').onclick = e => vote(p, e.currentTarget);
  linkTags(el.querySelector('.body'));
  el.querySelector('.body').addEventListener('click', e => {
    const t = e.target.closest('.tg'); if (t) { e.stopPropagation(); goTag(t.textContent); return; }
    const im = e.target.closest('img');

async function shrink(file, max = 2048) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    return b || file;
  } catch (e) { return file; }
}

async function digest(bytes) {
  if (dhive.cryptoUtils && dhive.cryptoUtils.sha256) return dhive.cryptoUtils.sha256(bytes);
  return new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
}

async function uploadImage(file) {
  const blob = await shrink(file);
  const data = new Uint8Array(await blob.arrayBuffer());
  const pre = new TextEncoder().encode('ImageSigningChallenge');
  const all = new Uint8Array(pre.length + data.length);
  all.set(pre); all.set(data, pre.length);
  const sig = key.sign(await digest(all)).toString();
  const fd = new FormData(); fd.append('file', blob, 'photo.jpg');
  const r = await fetch(`https://images.hive.blog/${me}/${sig}`, { method: 'POST', body: fd });
  if (!r.ok) throw new Error('сервер відповів ' + r.status);
  const j = await r.json();
  if (!j.url) throw new Error('у відповіді немає посилання');
  return j.url;
}

function tusUpload(file, owner, apiKey, short, onProgress) {

    let embed = '';
    new tus.Upload(file, {
      endpoint: 'https://embed.3speak.tv/uploads', retryDelays: [0, 2000, 5000],
      headers: { 'X-API-Key': apiKey },

      onError: reject,
      onProgress: (a, b) => onProgress(Math.round(a / b * 100)),
      onAfterResponse: (req, res) => { const h = res.getHeader('X-Embed-URL'); if (h) embed = h; },
      onSuccess: () => embed ? resolve(embed) : reject(new Error('сервер не повернув посилання на відео'))
    }).start();
  });
}

function downloadIcs(local, title, note) {
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const esc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const start = new Date(local), end = new Date(start.getTime() + 15 * 60000), now = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//my-hive-app//UK', 'BEGIN:VEVENT',
    `UID:${Date.now().toString(36)}@my-hive-app`, `DTSTAMP:${now}`, `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
    `SUMMARY:${esc(title)}`, `DESCRIPTION:${esc(note)}`, 'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${esc(title)}`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'hive-reminder.ics';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

$('#rbtn').onclick = () => {
  const v = $('#rtime').value, out = (t, c) => { $('#up').textContent = t; $('#up').className = c || ''; };
  if (!v) return out('Оберіть дату й час нагадування.', 'err');
  if (new Date(v) < new Date()) return out('Цей час уже минув.', 'err');
  downloadIcs(v, 'Опублікувати хвилю на Hive', 'Відкрийте Hive Threads і опублікуйте запис.');
  out('Файл нагадування створено. Відкрийте його, щоб додати подію в календар.', 'ok');
};

/* ---- закриття вікон жестами ---- */
document.querySelectorAll('.sheet').forEach(sh => {
  const panel = sh.firstElementChild;
  sh.addEventListener('click', e => { if (e.target === sh) sh.classList.remove('open'); });
  let y0 = 0, dy = 0, drag = false, ok = false, t0 = 0;
  panel.addEventListener('touchstart', e => {
    y0 = e.touches[0].clientY; dy = 0; drag = false; t0 = Date.now();
    ok = !e.target.closest('textarea, input');
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    if (!ok) return;
    const d = e.touches[0].clientY - y0;
    if (!drag && d > 12 && panel.scrollTop <= 0) drag = true;
    if (drag) { dy = Math.max(0, d); panel.style.transition = 'none'; panel.style.transform = `translateY(${dy}px)`; e.preventDefault(); }
  }, { passive: false });
  panel.addEventListener('touchend', () => {
    if (!drag) return;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.6; drag = false;
    panel.style.transition = ''; panel.style.transform = '';
    if (dy > 110 || fast) sh.classList.remove('open');
  });
});

/* ---- кнопка «назад» закриває верхнє вікно ---- */
const openStack = []; let ignorePop = 0, skipBack = 0;
const isOpenEl = el => el.id === 'lb' ? !el.hidden : el.classList.contains('open');
const navObs = new MutationObserver(muts => {
  let closed = 0;
  muts.forEach(m => {
    const el = m.target, open = isOpenEl(el), i = openStack.indexOf(el);
    if (open && i < 0) { openStack.push(el); history.pushState({ s: 1 }, ''); }
    else if (!open && i >= 0) { openStack.splice(i, 1); if (skipBack > 0) skipBack--; else closed++; }
  });
  if (closed) { ignorePop++; history.go(-closed); }
});
document.querySelectorAll('.sheet, #lb').forEach(el => navObs.observe(el, { attributes: true, attributeFilter: ['class', 'hidden'] }));
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  const top = openStack[openStack.length - 1];
  if (top) { skipBack++; if (top.id === 'lb') closeLb(); else top.classList.remove('open'); }
});
loadFeed();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
